[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "Nika"
version = "0.1.0"
description = "网络故障诊断智能体系统及基准测试平台"
readme = "README.md"
requires-python = ">=3.12"

dependencies = [
    "python-dotenv==1.2.2",
    "langgraph==1.1.6",
    "langchain==1.2.15",
    "langchain-openai==1.1.13",
    "requests==2.33.1",
    "mcp==1.27.0",
    "flask==3.1.3",
    "flask-socketio==5.6.1",
    "langchain-mcp-adapters==0.2.2",
    "langchain-community",
    "rank-bm25==0.2.2",
    "langchain-milvus",
    "langchain-huggingface==1.2.1",
    "langchain-text-splitters==1.1.1",
    "sentence-transformers==5.3.0",
    "pymilvus==2.6.11",
    "milvus-lite",
    "setuptools<70.0.0",
    "torch",
    "fnss==0.9.1",
    "httpx==0.28.1",
    "jieba==0.42.1",
    "langchain-core==1.2.30",
    "numpy==2.4.4",
    "pydantic==2.13.1",
    "pymysql==1.1.2",
    "transformers==5.4.0",
    "webserver==0.10.3",
]

[tool.setuptools]
include-package-data = true
package-dir = {"" = "src", "KlonetAPI" = "KlonetAPI"}
py-modules = ["orchestrator"]

[tool.setuptools.packages.find]
where = [".", "src"]
include = [
    "KlonetAPI*", 
    "agent*",  
    "net_env*", 
    "mcp_server*", 
    "utils*"
]
namespaces = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
