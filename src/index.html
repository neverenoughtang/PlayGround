<!DOCTYPE html>
<html lang="zh-CN" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Klonet Agent UI</title>
    <!-- 引入 Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        gray: {
                            750: '#2d3748',
                            850: '#1f2937',
                            900: '#111827',
                            950: '#030712',
                        }
                    }
                }
            }
        }
    </script>
    <!-- 引入 Vue 3 -->
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <style>
        /* 优化滚动条样式 */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(156, 163, 175, 0.5);
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(107, 114, 128, 0.8);
        }
        /* 隐藏无状态下的默认元素背景 */
        .hide-scrollbar::-webkit-scrollbar {
            display: none;
        }
        /* 打字机光标闪烁动画 */
        .typing-cursor {
            display: inline-block;
            width: 6px;
            height: 18px;
            background-color: currentColor;
            margin-left: 2px;
            vertical-align: middle;
            animation: blink 1s step-end infinite;
        }
        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }
    </style>
</head>
<body class="bg-white dark:bg-gray-800 text-gray-800 dark:text-gray-100 transition-colors duration-300 antialiased overflow-hidden">
    <div id="app" class="flex h-screen w-full">
        
        <!-- 侧边栏 (历史对话) -->
        <aside class="w-64 flex-shrink-0 bg-gray-50 dark:bg-gray-950 border-r border-gray-200 dark:border-gray-800 flex flex-col transition-colors duration-300 relative z-20">
            <!-- 新建对话按钮 -->
            <div class="p-3">
                <button @click="createNewChat" class="w-full flex items-center gap-3 px-3 py-3 rounded-md border border-gray-300 dark:border-gray-700 hover:bg-gray-100 dark:hover:bg-gray-800 transition-colors">
                    <svg stroke="currentColor" fill="none" stroke-width="2" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round" class="h-4 w-4" xmlns="http://www.w3.org/2000/svg"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
                    <span class="text-sm font-medium">新对话</span>
                </button>
            </div>

            <!-- 历史记录列表 -->
            <div class="flex-1 overflow-y-auto p-3 space-y-2">
                <div v-for="chat in chats" :key="chat.id" 
                     @click="selectChat(chat.id)"
                     class="group relative flex items-center gap-3 px-3 py-3 rounded-md cursor-pointer transition-colors"
                     :class="currentChatId === chat.id ? 'bg-gray-200 dark:bg-gray-800' : 'hover:bg-gray-100 dark:hover:bg-gray-900'">
                    
                    <svg stroke="currentColor" fill="none" stroke-width="2" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round" class="h-4 w-4 flex-shrink-0 text-gray-500 dark:text-gray-400" xmlns="http://www.w3.org/2000/svg"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>
                    
                    <div class="flex-1 overflow-hidden text-ellipsis whitespace-nowrap text-sm">
                        {{ chat.title }}
                    </div>

                    <!-- 删除按钮 (悬浮显示) -->
                    <button @click.stop="deleteChat(chat.id)" class="opacity-0 group-hover:opacity-100 p-1 hover:text-red-500 transition-opacity flex-shrink-0">
                        <svg stroke="currentColor" fill="none" stroke-width="2" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round" class="h-4 w-4" xmlns="http://www.w3.org/2000/svg"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
                    </button>
                </div>
            </div>

            <!-- 底部设置栏 (主题切换) -->
            <div class="p-3 border-t border-gray-200 dark:border-gray-800">
                <button @click="toggleTheme" class="w-full flex items-center gap-3 px-3 py-3 rounded-md hover:bg-gray-100 dark:hover:bg-gray-800 transition-colors">
                    <template v-if="isDarkMode">
                        <svg stroke="currentColor" fill="none" stroke-width="2" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round" class="h-4 w-4" xmlns="http://www.w3.org/2000/svg"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>
                        <span class="text-sm font-medium">切换至明亮模式</span>
                    </template>
                    <template v-else>
                        <svg stroke="currentColor" fill="none" stroke-width="2" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round" class="h-4 w-4" xmlns="http://www.w3.org/2000/svg"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
                        <span class="text-sm font-medium">切换至暗黑模式</span>
                    </template>
                </button>
            </div>
        </aside>

        <!-- 主对话区域 -->
        <main class="flex-1 flex flex-col h-full bg-white dark:bg-gray-800 relative z-10">
            
            <!-- 顶栏状态区 -->
            <header class="flex items-center relative h-20 px-6 border-b border-gray-200 dark:border-gray-800 shrink-0 bg-gray-50 dark:bg-gray-900 z-20">
                <!-- 左侧大标题 -->
                <div class="text-3xl font-black tracking-wider text-gray-800 dark:text-gray-100">
                    Nika
                </div>
                <!-- 中央状态信息 (预留变量) -->
                <div class="absolute left-1/2 -translate-x-1/2 flex items-center text-sm font-mono font-medium text-gray-500 dark:text-gray-400">
                    <span>{{ date }} | {{ labName }} | {{ faultName }}</span>
                </div>
            </header>

            <!-- 对话消息列表 -->
            <div id="messages-container" class="flex-1 overflow-y-auto pb-32 pt-6">
                <template v-if="currentChat && currentChat.messages.length > 0">
                    <!-- 气泡式聊天布局 -->
                    <div v-for="(msg, index) in currentChat.messages" :key="index"
                         class="w-full flex px-4 md:px-8 py-3"
                         :class="msg.role === 'assistant' ? 'justify-start' : 'justify-end'">
                        
                        <div class="flex gap-3 md:gap-4 max-w-[90%] md:max-w-[75%]"
                             :class="msg.role === 'assistant' ? 'flex-row' : 'flex-row-reverse'">
                             
                            <!-- 头像 -->
                            <div class="flex-shrink-0 flex flex-col relative items-center pt-1">
                                <div class="w-9 h-9 rounded-full flex items-center justify-center shadow-sm overflow-hidden"
                                     :class="msg.role === 'assistant' ? 'bg-cyan-700' : 'bg-slate-500'">
                                    <template v-if="msg.role === 'assistant'">
                                        <!-- 更具智能感的 Agent 图标 -->
                                        <svg stroke="currentColor" fill="none" stroke-width="2" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round" class="text-white h-5 w-5" xmlns="http://www.w3.org/2000/svg">
                                            <rect x="3" y="11" width="18" height="10" rx="2"></rect>
                                            <circle cx="12" cy="5" r="2"></circle>
                                            <path d="M12 7v4"></path>
                                            <line x1="8" y1="16" x2="8" y2="16"></line>
                                            <line x1="16" y1="16" x2="16" y2="16"></line>
                                        </svg>
                                    </template>
                                    <template v-else>
                                        <!-- 用户原有图标 -->
                                        <svg stroke="currentColor" fill="none" stroke-width="2" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round" class="text-white h-5 w-5" xmlns="http://www.w3.org/2000/svg">
                                            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                                            <circle cx="12" cy="7" r="4"></circle>
                                        </svg>
                                    </template>
                                </div>
                            </div>
                            
                            <!-- 气泡文本框 -->
                            <div class="flex-1 whitespace-pre-wrap leading-relaxed text-[15px] px-5 py-3.5 rounded-2xl shadow-sm border"
                                 :class="msg.role === 'assistant' 
                                    ? 'bg-gray-50 dark:bg-[#2d3748] text-gray-800 dark:text-gray-100 rounded-tl-sm border-gray-200 dark:border-gray-700' 
                                    : 'bg-gray-100 dark:bg-[#374151] text-gray-800 dark:text-gray-100 rounded-tr-sm border-gray-300 dark:border-gray-600'">
                                {{ msg.content }}<span v-if="msg.isTyping" class="typing-cursor"></span>
                            </div>
                        </div>
                    </div>
                </template>

                <!-- 空白状态下：保持纯净，没有文字 -->
                <div v-else class="h-full flex flex-col items-center justify-center space-y-4 px-4 text-center">
                    <!-- 根据需求，已清空中央字样 -->
                </div>
            </div>

            <!-- 底部输入框区域 -->
            <div class="absolute bottom-0 left-0 w-full bg-gradient-to-t from-white via-white dark:from-gray-800 dark:via-gray-800 to-transparent pt-6 pb-6 px-4 md:px-8">
                <div class="max-w-4xl mx-auto flex flex-col relative">
                    <form @submit.prevent="sendMessage" class="relative flex flex-col w-full px-3 py-3 rounded-2xl border border-black/10 dark:border-gray-700 bg-white dark:bg-gray-700 shadow-[0_0_15px_rgba(0,0,0,0.05)] dark:shadow-[0_0_15px_rgba(0,0,0,0.15)] focus-within:ring-2 focus-within:ring-blue-500/50 transition-all">
                        <textarea v-model="inputText" 
                                  @keydown.enter.prevent="sendMessage"
                                  rows="1" 
                                  class="m-0 w-full resize-none border-0 bg-transparent p-0 pr-10 focus:ring-0 focus-visible:ring-0 text-sm md:text-base max-h-48 overflow-y-auto hide-scrollbar outline-none" 
                                  placeholder="发送消息给 Nika..." 
                                  style="min-height: 24px; max-height: 200px;"></textarea>
                        
                        <button type="submit" 
                                :disabled="!inputText.trim() || isReceiving"
                                class="absolute right-2 bottom-2 p-1.5 rounded-xl transition-colors disabled:opacity-40"
                                :class="inputText.trim() && !isReceiving ? 'bg-slate-700 text-white hover:bg-slate-800 dark:bg-slate-600 dark:hover:bg-slate-500' : 'bg-gray-200 text-gray-400 dark:bg-gray-600 dark:text-gray-400'">
                            <svg stroke="currentColor" fill="none" stroke-width="2" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5" xmlns="http://www.w3.org/2000/svg"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
                        </button>
                    </form>
                    <!-- 替换后的底部注脚信息 -->
                    <div class="text-xs text-center text-gray-400 dark:text-gray-500 mt-3 font-medium">
                        基于 Klonet 虚拟网络仿真器的网络故障诊断智能体全流程测试平台
                    </div>
                </div>
            </div>

        </main>
    </div>

    <!-- Vue 逻辑 -->
    <script>
        const { createApp, ref, computed, nextTick } = Vue;

        createApp({
            setup() {
                // 顶部预留变量
                const date = ref('2026-03-23');
                const labName = ref('static_routing');
                const faultName = ref('arp_poisoning');

                // 状态管理
                const isDarkMode = ref(true);
                const inputText = ref('');
                const currentChatId = ref(1);
                const isReceiving = ref(false); // 正在接收流式回复的状态锁定
                
                const chats = ref([
                    { id: 1, title: '新对话', messages: [] }
                ]);

                // 计算属性
                const currentChat = computed(() => {
                    return chats.value.find(c => c.id === currentChatId.value);
                });

                // 新建对话
                const createNewChat = () => {
                    const newId = Date.now();
                    chats.value.unshift({ id: newId, title: '新对话', messages: [] });
                    currentChatId.value = newId;
                };

                // 选择对话
                const selectChat = (id) => {
                    currentChatId.value = id;
                };

                // 删除对话
                const deleteChat = (id) => {
                    chats.value = chats.value.filter(c => c.id !== id);
                    if (chats.value.length === 0) {
                        createNewChat();
                    } else if (currentChatId.value === id) {
                        currentChatId.value = chats.value[0].id;
                    }
                };

                // 滚动到底部
                const scrollToBottom = async () => {
                    await nextTick();
                    const container = document.getElementById('messages-container');
                    if (container) {
                        container.scrollTop = container.scrollHeight;
                    }
                };

                // 发送消息与流式打字机效果模拟
                const sendMessage = async () => {
                    const text = inputText.value.trim();
                    if (!text || !currentChat.value || isReceiving.value) return;

                    // 1. 推送用户消息
                    currentChat.value.messages.push({ role: 'user', content: text, isTyping: false });
                    inputText.value = '';

                    // 动态修改新对话标题
                    if (currentChat.value.messages.length === 1) {
                        currentChat.value.title = text.length > 15 ? text.substring(0, 15) + '...' : text;
                    }

                    await scrollToBottom();
                    isReceiving.value = true;

                    // 2. 模拟网络请求延迟后，推送 AI 的空消息对象准备流式输出
                    setTimeout(() => {
                        const replyFull = `您好！检测到当前环境【${labName.value}】存在异常症状指纹【${faultName.value}】。\n\n您刚刚输入了： "${text}"\n\nNika Agent 正在通过流式（SSE）打字机效果为您生成分析报告，并且我们已经全面重构了圆角气泡对话 UI！`;
                        
                        const msgObj = { role: 'assistant', content: '', isTyping: true };
                        currentChat.value.messages.push(msgObj);
                        
                        let i = 0;
                        // 3. 定时器模拟 SSE 数据流逐字推入
                        const typeWriter = setInterval(() => {
                            if (i < replyFull.length) {
                                msgObj.content += replyFull.charAt(i);
                                i++;
                                scrollToBottom();
                            } else {
                                clearInterval(typeWriter);
                                msgObj.isTyping = false;
                                isReceiving.value = false;
                            }
                        }, 40); // 每 40 毫秒生成一个字
                    }, 500); // 假装请求延迟 500 毫秒
                };

                // 主题切换
                const toggleTheme = () => {
                    isDarkMode.value = !isDarkMode.value;
                    const htmlEl = document.documentElement;
                    if (isDarkMode.value) {
                        htmlEl.classList.add('dark');
                    } else {
                        htmlEl.classList.remove('dark');
                    }
                };

                return {
                    date,
                    labName,
                    faultName,
                    isDarkMode,
                    inputText,
                    chats,
                    currentChatId,
                    currentChat,
                    isReceiving,
                    createNewChat,
                    selectChat,
                    deleteChat,
                    sendMessage,
                    toggleTheme
                };
            }
        }).mount('#app');
    </script>
</body>
</html>
